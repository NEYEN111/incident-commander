{% extends "base.html" %}
{% block body_class %}pilot-login{% endblock %}
{% block content %}
<div class="pilot-auth">
  <section class="pilot-auth-card" aria-labelledby="login-title">
    <div class="pilot-auth-brand">{{ app_name }}</div>
    <h1 id="login-title">Iniciar sesión</h1>
    {% if error %}<div class="pilot-login-error" id="login-error" role="alert">{{ error | ui_es }}</div>{% endif %}
    <form class="pilot-login-form" method="post" action="/login"{% if error %} aria-describedby="login-error"{% endif %}>
      <label for="login-email">Correo electrónico</label>
      <input id="login-email" type="email" name="email" value="{{ email | default('') }}" autocomplete="username" required autofocus>
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" name="password" autocomplete="current-password" required>
      <button class="pilot-login-submit" type="submit">Iniciar sesión</button>
    </form>
    {% if sso_enabled %}
    <div class="pilot-sso">
      <a class="pilot-sso-link" href="/login/oidc">Iniciar sesión con {{ sso_display_name or "tu proveedor de acceso" }}</a>
    </div>
    {% endif %}
  </section>
</div>
{% endblock %}
