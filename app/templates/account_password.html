{% extends "base.html" %}
{% block content %}
<div class="auth">
  <form class="auth-card" method="post" action="/account/password">
    <div class="mark">{{ app_name }}</div>
    <h1>Mi cuenta</h1>
    <p class="muted" style="margin:-12px 0 18px">Cambia tu contraseña.</p>
    {% if error %}<div class="alert">{{ error | ui_es }}</div>{% endif %}
    <label class="field"><span>Nueva contraseña</span><input type="password" name="new_password" required autofocus></label>
    <label class="field"><span>Confirmar contraseña</span><input type="password" name="confirm" required></label>
    <button class="btn btn-primary" type="submit">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
