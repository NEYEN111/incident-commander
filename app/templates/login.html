{% extends "base.html" %}
{% block content %}
<div class="auth">
  <form class="auth-card" method="post" action="/login">
    <div class="mark">{{ app_name }}</div>
    <h1>Iniciar sesión</h1>
    {% if error %}<div class="alert">{{ error | ui_es }}</div>{% endif %}
    <label class="field"><span>Correo electrónico</span><input type="email" name="email" required autofocus></label>
    <label class="field"><span>Contraseña</span><input type="password" name="password" required></label>
    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
  </form>
  {% if sso_enabled %}<a class="btn" href="/login/oidc" style="width:100%;justify-content:center;margin-top:10px">Iniciar sesión con {{ sso_display_name or "SSO" }}</a>{% endif %}
</div>
{% endblock %}
